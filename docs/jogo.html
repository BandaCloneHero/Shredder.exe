    <script>
        window.shredderAccount = new ShredderAccount();
        window.shredderUI = new ShredderAccountUI(window.shredderAccount);
        let sessionWasActive = false;
        window.shredderAccount.onChange((state) => {
            if (state.isLoggedIn) sessionWasActive = true;
            else if (sessionWasActive) window.location.href = 'index.html';
        });
    </script>
