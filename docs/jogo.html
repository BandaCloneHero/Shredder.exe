<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shredder.exe // Partida</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="jogo">
    <main class="page-shell">
        <section class="section-heading">
            <div><p class="eyebrow">PARTIDA // SINAL AO VIVO</p><h1>Shredder<span>.exe</span></h1></div>
        </section>
        <div id="phaser-game"></div>
        <p id="statusJogo" class="lobby-status" role="status" aria-live="polite">AGUARDANDO RESULTADO DA PARTIDA...</p>
        <div class="page-actions">
            <a href="lobby.html" class="button button-ghost">VOLTAR AO LOBBY</a>
            <button id="sincronizar-resultado" class="button button-primary" type="button" hidden>TENTAR SINCRONIZAR NOVAMENTE</button>
        </div>
    </main>
    <script src="js/account.js"></script>
    <script src="js/account-ui.js"></script>
    <script>
        window.shredderAccount = new ShredderAccount();
        window.shredderUI = new ShredderAccountUI(window.shredderAccount);
        let sessionWasActive = false;
        window.shredderAccount.onChange((state) => {
            if (state.isLoggedIn) sessionWasActive = true;
            else if (sessionWasActive) window.location.href = 'index.html';
        });
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
    <script src="js/resultado-partida.js"></script>
</body>
</html>
