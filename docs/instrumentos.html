<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shredder.exe - Escolha o Instrumento</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: #ffffff; text-align: center; padding: 50px; }
        .grid { display: flex; justify-content: center; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
        .card { background: #2a2a2a; padding: 30px; border-radius: 10px; width: 150px; cursor: pointer; transition: 0.2s; border: 2px solid transparent; }
        .card:hover { border-color: #4CAF50; background: #333; }
        h2 { color: #4CAF50; }
    </style>
</head>
<body>
    <h1>Escolha seu Instrumento</h1>
    <p>Selecione com o que você vai tocar na banda:</p>
    
    <div class="grid">
        <div class="card" onclick="escolher('Guitarra')"><h3>🎸</h3><p>Guitarra</p></div>
        <div class="card" onclick="escolher('Baixo')"><h3>🎸</h3><p>Baixo</p></div>
        <div class="card" onclick="escolher('Bateria')"><h3>🥁</h3><p>Bateria</p></div>
        <div class="card" onclick="escolher('Teclado')"><h3>🎹</h3><p>Teclado</p></div>
    </div>

    <script>
        function escolher(instrumento) {
            localStorage.setItem('shredder_instrumento', instrumento);
            window.location.href = 'modos.html';
        }
    </script>
</body>
</html>
